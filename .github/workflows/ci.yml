name: CI

# Runs the same checks the repo already defines at the root
# (build/test/lint/typecheck, all orchestrated by Turborepo) on every push
# to main and every PR. This is intentionally just a gate on scripts that
# already exist and are verified to pass locally — it doesn't invent new
# checks, it just makes the existing ones mandatory instead of "someone
# remembered to run them before pushing."
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running CI run for the same branch/PR when a new commit
# supersedes it, instead of burning minutes on stale code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's "packageManager" field
      # rather than hardcoding one here, so the two can't drift apart.
      - uses: pnpm/action-setup@v4

      # pnpm 11's own CLI needs Node >=22.13 to run at all (unrelated to
      # this repo's own `engines.node` — that's the minimum for the repo's
      # code, this is what the package manager binary itself requires) —
      # node-version 20 here made `pnpm install` fail before it could even
      # read package.json, on every job in this file.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters for turbo's cache reuse: build primes the
      # shared-types dist output that test/typecheck depend on
      # (turbo.json's `dependsOn: ["^build"]`), so later steps hit cache
      # instead of rebuilding it.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  rls-tests:
    # Proves the ownership boundary described in CLAUDE.md ("RLS policies
    # are the enforcement boundary for ownership ... don't add
    # client-side-only checks as a substitute for RLS") actually holds —
    # see apps/api/tests/rls.test.ts. This needs a real local Postgres +
    # GoTrue + PostgREST stack (Docker, via the Supabase CLI), which is
    # why it's a separate job from `ci` above rather than folded into its
    # `pnpm test` step: a fast unit-test run shouldn't have to wait on
    # spinning up containers, and `ci`'s `test` task has no Docker
    # dependency today. ubuntu-latest's runner has Docker preinstalled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # pnpm 11's own CLI needs Node >=22.13 to run at all (unrelated to
      # this repo's own `engines.node` — that's the minimum for the repo's
      # code, this is what the package manager binary itself requires) —
      # node-version 20 here made `pnpm install` fail before it could even
      # read package.json, on every job in this file.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration under apps/api/supabase/migrations
      # (0001_init.sql onward) to a throwaway local Postgres, including
      # the RLS policies and grants those tests exercise, plus the
      # 0003/0004 dev-seed fixture the tests read their catalog rows from.
      # `start` already runs migrations on a fresh instance; `db reset`
      # after it is a cheap, explicit guarantee of a fully-migrated state
      # regardless of what the CLI's own caching does under the hood.
      - name: Start local Supabase and apply migrations
        working-directory: apps/api
        run: |
          supabase start
          supabase db reset

      # Exports API_URL/ANON_KEY (among others) as env vars for the next
      # step — see apps/api/tests/rls.test.ts's own guard/error message if
      # these default names ever drift in a future CLI version.
      #
      # `-o env` emits dotenv-style `KEY="value"` lines meant to be sourced
      # by a shell, which strips the quotes itself — $GITHUB_ENV does not,
      # it takes everything after the first `=` as the literal value. Piped
      # straight through, ANON_KEY/API_URL would come out as e.g.
      # `"http://127.0.0.1:54321"` (quote characters included), which
      # supabase-js's own URL validation then rejects outright. Strip one
      # layer of wrapping double quotes per line before appending.
      - name: Export local Supabase connection details
        working-directory: apps/api
        run: supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Run RLS test suite
        working-directory: apps/api
        run: pnpm test:rls

      - name: Stop local Supabase
        if: always()
        working-directory: apps/api
        run: supabase stop
